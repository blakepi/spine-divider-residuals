[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spine-divider-residuals"
version = "1.0.0"
description = "SPINE dendritic-spine compartmental modeling and load-normalized divider residual analysis."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Gregory Pierpoint", email = "pierpogb@odu.edu" },
  { name = "Alberto Musto", email = "mustoae@odu.edu" }
]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
spine = "spine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
